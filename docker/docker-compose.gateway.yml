# 工时聚合 + 项目控制面网关。
#
# 局域网访问：默认只绑定内网网卡 192.168.2.170:3090（本机也从该地址访问）。

name: dsh-timesheet-gateway

services:
  gateway:
    image: node:22-alpine
    command: ["node", "/app/gateway.mjs"]
    environment:
      GATEWAY_PORT: "3090"
      GATEWAY_TIMEOUT_MS: "${GATEWAY_TIMEOUT_MS:-15000}"
      GATEWAY_REPO_DIR: /workspace/docker
      GATEWAY_NETWORK: dsh-shared
      GATEWAY_DEFAULT_IMAGE: "${GATEWAY_DEFAULT_IMAGE:-dsh-collaborationagent:05ee9ab9f77304f19b494c71a932a77e55ef47c1}"
    volumes:
      - ./gateway/gateway.mjs:/app/gateway.mjs:ro
      - ./gateway/projects.json:/app/projects.json
      - ./gateway/defaults.env:/app/defaults.env:ro
      - ./:/workspace/docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dsh-shared
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-192.168.2.170}:3090:3090"

networks:
  dsh-shared:
    external: true



