# 工时聚合 + 项目控制面网关。
#
# 宿主机前端要用时取消 ports 注释（只占一个端口）。

name: dsh-timesheet-gateway

services:
  gateway:
    image: node:22-alpine
    command: ["node", "/app/gateway.mjs"]
    environment:
      GATEWAY_PORT: "3090"
      GATEWAY_TIMEOUT_MS: "${GATEWAY_TIMEOUT_MS:-15000}"
      GATEWAY_REPO_DIR: /workspace/docker
      GATEWAY_NETWORK: dsh-shared
      GATEWAY_DEFAULT_IMAGE: "${GATEWAY_DEFAULT_IMAGE:-dsh-superagent-project:8fb09223df0776e68b09edd0d044df61025d1efa}"
    volumes:
      - ./gateway/gateway.mjs:/app/gateway.mjs:ro
      - ./gateway/projects.json:/app/projects.json
      - ./gateway/defaults.env:/app/defaults.env:ro
      - ./:/workspace/docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dsh-shared
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:3090:3090"

networks:
  dsh-shared:
    external: true
