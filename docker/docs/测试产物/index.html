<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>我的待办</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2f6feb;
      --primary-dark: #265fd0;
      --text: #1f2430;
      --muted: #8a90a2;
      --line: #eceef4;
      --danger: #e5484d;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }

    .app__title {
      margin: 0 0 20px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* ---------- 新增输入区 ---------- */
    .add-form {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .add-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      padding: 0 14px;
      font-size: 16px;
      color: var(--text);
      background: #fafbff;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .add-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.15);
    }

    .btn-primary {
      flex: 0 0 auto;
      min-height: 48px;
      min-width: 88px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:active { transform: translateY(1px); }

    /* ---------- 筛选区 ---------- */
    .filters {
      display: flex;
      gap: 6px;
      margin: 22px 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .filter-btn {
      flex: 1 1 0;
      min-height: 44px;
      padding: 0 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .filter-btn:hover { color: var(--text); }

    .filter-btn[aria-pressed="true"] {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ---------- 列表区 ---------- */
    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
    }

    .todo-item:last-child { border-bottom: none; }

    .toggle {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .todo-text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 16px;
      word-break: break-word;
      overflow-wrap: anywhere;
      cursor: text;
    }

    .todo-item.is-done .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .icon-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: #f2f4f9; color: var(--text); }

    .icon-btn.danger:hover { background: rgba(229, 72, 77, 0.1); color: var(--danger); }

    /* ---------- 行内编辑 ---------- */
    .edit-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      padding: 0 10px;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--primary);
      border-radius: 8px;
      outline: none;
      box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.15);
    }

    .edit-cancel {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--muted);
      background: #f2f4f9;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .edit-cancel:hover { color: var(--text); }

    /* ---------- 空状态 ---------- */
    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    .empty__icon {
      display: block;
      font-size: 34px;
      margin-bottom: 10px;
      opacity: 0.55;
    }

    /* ---------- 底部统计 ---------- */
    .stats {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      text-align: right;
      font-size: 14px;
      color: var(--muted);
    }

    /* 隐藏辅助 */
    [hidden] { display: none !important; }

    /* ---------- 移动端 ---------- */
    @media (max-width: 639px) {
      body { padding: 12px 10px 28px; }
      .app { padding: 20px 16px 16px; border-radius: 12px; }
      .app__title { font-size: 22px; margin-bottom: 16px; }
      .add-form { flex-direction: column; }
      .btn-primary { width: 100%; }
      .filters { gap: 2px; }
      .filter-btn { font-size: 14px; padding: 0 4px; }
      .todo-item { gap: 8px; }
      .stats { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="app__title">我的待办</h1>

    <!-- 新增输入区 -->
    <form class="add-form" id="add-form" autocomplete="off">
      <input
        id="add-input"
        class="add-input"
        type="text"
        placeholder="添加一条待办，回车即可保存"
        aria-label="添加一条待办"
        maxlength="500"
      />
      <button type="submit" class="btn-primary" id="add-btn">添加</button>
    </form>

    <!-- 筛选区 -->
    <nav class="filters" id="filters" aria-label="筛选待办">
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成 (0)</button>
      <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">已完成</button>
    </nav>

    <!-- 列表区 -->
    <ul class="todo-list" id="todo-list" aria-label="待办列表"></ul>

    <!-- 空状态区 -->
    <div class="empty" id="empty-state" hidden>
      <span class="empty__icon" aria-hidden="true">🗒️</span>
      <span id="empty-text">还没有待办，添加第一条吧</span>
    </div>

    <!-- 底部统计 -->
    <div class="stats" id="stats" aria-live="polite">全部完成</div>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "todo-app:v1";

      var state = {
        todos: [],
        filter: "all", // all | active | done
        editingId: null
      };

      // ---------- DOM 引用 ----------
      var form = document.getElementById("add-form");
      var input = document.getElementById("add-input");
      var list = document.getElementById("todo-list");
      var emptyState = document.getElementById("empty-state");
      var emptyText = document.getElementById("empty-text");
      var stats = document.getElementById("stats");
      var filterBar = document.getElementById("filters");
      var filterButtons = filterBar.querySelectorAll(".filter-btn");

      // ---------- 持久化 ----------
      function load() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];
          return data
            .filter(function (t) {
              return t && typeof t.text === "string";
            })
            .map(function (t) {
              return {
                id: typeof t.id === "string" && t.id ? t.id : uid(),
                text: t.text,
                done: !!t.done,
                createdAt: typeof t.createdAt === "number" ? t.createdAt : Date.now()
              };
            });
        } catch (e) {
          // 非法 JSON / 结构异常：按空列表处理并重置，保证不抛错
          try { window.localStorage.removeItem(STORAGE_KEY); } catch (e2) {}
          return [];
        }
      }

      function save() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.todos));
        } catch (e) {
          // 存储不可用（隐私模式/超限）时静默降级，不影响使用
        }
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      // ---------- 查询 ----------
      function activeCount() {
        return state.todos.reduce(function (n, t) { return t.done ? n : n + 1; }, 0);
      }

      function visibleTodos() {
        return state.todos
          .filter(function (t) {
            if (state.filter === "active") return !t.done;
            if (state.filter === "done") return t.done;
            return true;
          })
          .sort(function (a, b) { return b.createdAt - a.createdAt; });
      }

      function emptyMessage() {
        if (state.filter === "active") return "太棒了，没有未完成的待办";
        if (state.filter === "done") return "还没有已完成的待办";
        return "还没有待办，添加第一条吧";
      }

      // ---------- 操作 ----------
      function addTodo(text) {
        var v = text.trim();
        if (!v) return false;
        state.todos.push({ id: uid(), text: v, done: false, createdAt: Date.now() });
        save();
        render();
        return true;
      }

      function toggleTodo(id) {
        var t = findTodo(id);
        if (!t) return;
        t.done = !t.done;
        save();
        render();
      }

      function deleteTodo(id) {
        state.todos = state.todos.filter(function (t) { return t.id !== id; });
        if (state.editingId === id) state.editingId = null;
        save();
        render();
      }

      function startEdit(id) {
        state.editingId = id;
        render();
        var el = list.querySelector(".edit-input");
        if (el) {
          el.focus();
          el.select();
        }
      }

      function commitEdit(id, value) {
        if (state.editingId !== id) return;
        var v = value.trim();
        if (!v) {
          // 保存为空视为删除，避免出现空待办
          deleteTodo(id);
          return;
        }
        var t = findTodo(id);
        if (t) t.text = v;
        state.editingId = null;
        save();
        render();
      }

      function cancelEdit() {
        state.editingId = null;
        render();
      }

      function findTodo(id) {
        for (var i = 0; i < state.todos.length; i++) {
          if (state.todos[i].id === id) return state.todos[i];
        }
        return null;
      }

      // ---------- 渲染 ----------
      function render() {
        var n = activeCount();

        // 筛选标签与高亮
        filterButtons.forEach(function (btn) {
          var f = btn.getAttribute("data-filter");
          if (f === "all") btn.textContent = "全部";
          else if (f === "active") btn.textContent = "未完成 (" + n + ")";
          else btn.textContent = "已完成";
          btn.setAttribute("aria-pressed", String(f === state.filter));
        });

        // 列表
        var items = visibleTodos();
        list.innerHTML = "";

        if (items.length === 0) {
          emptyState.hidden = false;
          emptyText.textContent = emptyMessage();
        } else {
          emptyState.hidden = true;
          items.forEach(function (t) {
            list.appendChild(buildItem(t));
          });
        }

        // 底部统计
        stats.textContent = n === 0 ? "全部完成" : "还剩 " + n + " 项未完成";
      }

      function buildItem(t) {
        var li = document.createElement("li");
        li.className = "todo-item" + (t.done ? " is-done" : "");
        li.setAttribute("data-id", t.id);

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "toggle";
        checkbox.checked = t.done;
        checkbox.setAttribute("aria-label", t.done ? "取消完成" : "标记完成");
        checkbox.addEventListener("change", function () { toggleTodo(t.id); });
        li.appendChild(checkbox);

        if (state.editingId === t.id) {
          var editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = t.text;
          editInput.maxLength = 500;
          editInput.setAttribute("aria-label", "编辑待办文字");
          editInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              commitEdit(t.id, editInput.value);
            } else if (e.key === "Escape") {
              e.preventDefault();
              cancelEdit();
            }
          });
          editInput.addEventListener("blur", function () {
            commitEdit(t.id, editInput.value);
          });
          li.appendChild(editInput);

          var cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "edit-cancel";
          cancelBtn.textContent = "取消";
          // 用 mousedown 阻止默认，避免输入框先触发 blur 保存，再轮到取消
          cancelBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
          cancelBtn.addEventListener("click", function () { cancelEdit(); });
          li.appendChild(cancelBtn);
        } else {
          var text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = t.text;
          text.title = "双击编辑";
          text.addEventListener("dblclick", function () { startEdit(t.id); });
          li.appendChild(text);

          var editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "icon-btn";
          editBtn.setAttribute("aria-label", "编辑");
          editBtn.title = "编辑";
          editBtn.textContent = "✎";
          editBtn.addEventListener("click", function () { startEdit(t.id); });
          li.appendChild(editBtn);

          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "icon-btn danger";
          delBtn.setAttribute("aria-label", "删除");
          delBtn.title = "删除";
          delBtn.textContent = "🗑";
          delBtn.addEventListener("click", function () { deleteTodo(t.id); });
          li.appendChild(delBtn);
        }

        return li;
      }

      // ---------- 事件绑定 ----------
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (addTodo(input.value)) {
          input.value = "";
        }
        input.focus();
      });

      filterBar.addEventListener("click", function (e) {
        var btn = e.target.closest(".filter-btn");
        if (!btn) return;
        state.filter = btn.getAttribute("data-filter");
        state.editingId = null;
        render();
      });

      // ---------- 初始化 ----------
      state.todos = load();
      render();
    })();
  </script>
</body>
</html>
